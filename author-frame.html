<body><div id="mima-author-status" role="status">作者宿主尚未授权启动</div><main id="mima-author-root"></main>
<script>
(()=>{'use strict';
 let port,initialized=false,snapshot=null,tables=new Map(),committed=new Map(),dirty=new Map(),inFlight=null,localId=0,scheduled=false,writable=false,available=false,activeUpdates=0,mutationEpoch=0;

 function report(state,message){if(status?.isConnected)status.textContent=message;port?.postMessage({type:'state',state,message:String(message).slice(0,800)});}

 function reset(next){

 function schemaOption(entry){return entry.type==='chat'?{type:'chat'}:{type:'message',message_id:entry.floor.value==='latest'?'latest':Number(entry.floor.value)};}

  text.rows=8;text.style.cssText='display:block;width:100%;box-sizing:border-box;max-height:260px';text.setAttribute('aria-label',option.type+' 变量 JSON');text.oninput=()=>entry.dirty=true;node.append(text);button.textContent='校验并保存';button.type='button';node.append(button,out);document.body.append(node);schemas.set(option.type,entry);refreshSchema(entry);
