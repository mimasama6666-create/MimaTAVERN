<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="referrer" content="no-referrer"><style>body{font:14px sans-serif;color:#ddd;background:#20212a;margin:8px}button{cursor:pointer}</style></head><body><div id="plugin-status">插件隔离环境未启动</div><script id="plugin-worker-source" type="text/plain">
/* Worker-owned untrusted SDK script. No DOM, no parent, no local storage or app secrets. */
'use strict';
let nextId=0;const calls=new Map(),events=new Map();
function call(method,args){return new Promise((resolve,reject)=>{const requestId=++nextId;calls.set(requestId,{resolve,reject});postMessage({type:'rpc',requestId,method,args});});}
const sdk=Object.freeze({
 getChatMessages:()=>call('getChatMessages'),
 getVariables:()=>call('getVariables'),
 getMvuState:()=>call('getMvuState'),
 setVariables:(value,expectedRevision)=>call('setVariables',{value,expectedRevision}),
 uiButton:(label,id)=>call('uiButton',{label,id}),
 on:(name,fn)=>{
  if(typeof fn!=='function')throw new Error('E_PLUGIN_API_UNSUPPORTED: invalid event callback');
  const allowed=['session.mounted','turn.committed','turn.failed','assistant.continued','button','mvu.changed'];
  if(!allowed.includes(name))throw new Error('E_PLUGIN_API_UNSUPPORTED: '+name);
  const list=events.get(name)||new Set();const wasEmpty=list.size===0;list.add(fn);events.set(name,list);
  if(wasEmpty&&name!=='button')call('subscribe',{name}).catch(e=>postMessage({type:'script-error',message:e.message,code:e.code}));
  return()=>{list.delete(fn);if(!list.size&&name!=='button')call('unsubscribe',{name}).catch(e=>postMessage({type:'script-error',message:e.message,code:e.code}));};
 }
});
self.onmessage=async e=>{
 const p=e.data;if(!p)return;
 if(p.type==='rpc-result'){
  const job=calls.get(p.requestId);if(!job)return;calls.delete(p.requestId);
  if(p.error)job.reject(Object.assign(new Error(p.error.message),{code:p.error.code}));else job.resolve(p.result);
 }else if(p.type==='event'){
  try{for(const fn of events.get(p.name)||[])await fn(Object.freeze({name:p.name,eventId:p.eventId,detail:p.detail,buttonId:p.buttonId}));postMessage({type:'event-ack',eventId:p.eventId});}
  catch(err){postMessage({type:'script-error',code:'E_PLUGIN_SCRIPT',message:String(err.message||err)});postMessage({type:'event-ack',eventId:p.eventId});}
 }else if(p.type==='start'){
  try{if(typeof self.__runScript!=='function')throw new Error('E_PLUGIN_API_UNSUPPORTED: missing Worker script');await self.__runScript(sdk);postMessage({type:'ready'});}
  catch(err){postMessage({type:'script-error',code:'E_PLUGIN_SCRIPT',message:String(err.message||err)});}
 }
};
</script>
<script>
/* Only sandboxed opaque-origin iframe controller. Script is executed by a disposable blob Worker. */
(()=>{'use strict';let initialized=false,port=null,worker=null,job=0;
const status=document.getElementById('plugin-status'),inlineSource=document.getElementById('plugin-worker-source');
const awaiting=new Map();function trouble(code,message){status.textContent=code+': '+message;}
function stop(code,message){for(const timer of awaiting.values())clearTimeout(timer);awaiting.clear();worker?.terminate();worker=null;if(message)trouble(code,message);}
window.addEventListener('message',ev=>{
 if(initialized||ev.source!==window.parent||ev.data?.type!=='mima-init'||ev.ports.length!==1)return;
 initialized=true;port=ev.ports[0];
 const source=String(ev.data.source||'');const scriptBundle=inlineSource.textContent+'\nself.__runScript=async function(MimaCompatSDK){\n\"use strict\";\n'+source+'\n};';const blob=new Blob([scriptBundle],{type:'text/javascript'}),url=URL.createObjectURL(blob);
 try{worker=new Worker(url,{name:'mima-compat-plugin-worker'});}catch(e){URL.revokeObjectURL(url);trouble('E_PLUGIN_WORKER',e.message);return;}
 URL.revokeObjectURL(url);
 const initTimer=setTimeout(()=>stop('E_PLUGIN_BUDGET','脚本初始化未完成，已强制终止隔离 Worker'),1500);
 worker.onmessage=event=>{
  const packet=event.data;
  if(packet?.type==='ready'){clearTimeout(initTimer);status.textContent='受控插件 Worker 已完成初始化（非 Tavern Helper 完整运行）';}
  else if(packet?.type==='script-error'){clearTimeout(initTimer);trouble(packet.code||'E_PLUGIN_SCRIPT',packet.message);}
  else if(packet?.type==='rpc')port.postMessage(packet);
  else if(packet?.type==='event-ack'){const timer=awaiting.get(packet.eventId);if(timer){clearTimeout(timer);awaiting.delete(packet.eventId);}}
 };
 worker.onerror=e=>{clearTimeout(initTimer);stop('E_PLUGIN_WORKER',e.message||'script execution error');};
 port.onmessage=e=>{
  const packet=e.data;if(!worker||!packet)return;
  if(packet.type==='rpc-result')worker.postMessage(packet);
  else if(packet.type==='event'){
   const eventId=packet.eventId||'button-'+(++job);
   const timer=setTimeout(()=>stop('E_PLUGIN_BUDGET','插件事件处理未在预算内完成，已终止隔离 Worker'),1500);
   awaiting.set(eventId,timer);worker.postMessage({...packet,eventId});
  }
 };
 worker.postMessage({type:'start'});
});
})();
</script></body></html>
